<!doctype html>
<html lang="en" data-site="nz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Altitude charts</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body { background: #fbfaf7; color: #142e2c; font-family: Arial, sans-serif; display: flex; flex-direction: column; }
    a { color: #164b45; text-underline-offset: 3px; }
    :focus-visible { outline: 2px solid #164b45; outline-offset: 3px; }
    [hidden] { display: none !important; }

    /* Top bar: same menus as the dashboard */
    .bar { flex: 0 0 auto; display: flex; align-items: stretch; gap: 4px; padding: 0 16px; background: white; border-bottom: 1px solid #cbd6d1; position: relative; z-index: 10; }
    .brand { display: flex; align-items: center; margin-right: 18px; font: 20px/1 Georgia, "Times New Roman", serif; letter-spacing: -.02em; color: #142e2c; text-decoration: none; }
    .menus { display: flex; align-items: stretch; gap: 2px; }
    .menu { position: relative; display: flex; }
    .menu > button, .home-link { display: flex; align-items: center; gap: 6px; padding: 14px 12px 12px; border: 0; border-bottom: 2px solid transparent; background: none; color: #142e2c; font: 14px Arial, sans-serif; cursor: pointer; text-decoration: none; }
    .menu > button::after { content: ""; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid currentColor; }
    .menu > button:hover, .home-link:hover { background: #f4f0e8; }
    .menu.current > button, .home-link.current { border-bottom-color: #164b45; color: #164b45; font-weight: 700; }
    .list { position: absolute; top: 100%; left: 0; min-width: 240px; margin: 0; padding: 6px 0; list-style: none; background: white; border: 1px solid #cbd6d1; box-shadow: 0 12px 28px rgba(20,46,44,.12); }
    .list a { display: block; padding: 8px 16px; color: #142e2c; text-decoration: none; font-size: 14px; }
    .list a:hover, .list a:focus-visible { background: #d8e5df; }
    .list a[aria-current="page"] { font-weight: 700; color: #164b45; }
    .list .group { padding: 10px 16px 4px; color: #367069; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .topics-button { display: none; }

    main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }

    /* Home: grid of cards, like the dashboard overview */
    .home { overflow-y: auto; padding: 28px clamp(16px, 5vw, 64px) 48px; }
    .home h1 { margin: 0 0 8px; font: 34px/1.1 Georgia, "Times New Roman", serif; letter-spacing: -.03em; }
    .home > p { margin: 0 0 8px; color: #48605e; line-height: 1.6; max-width: 720px; }
    .group-title { margin: 32px 0 14px; padding-bottom: 10px; border-bottom: 1px solid #cbd6d1; font-size: 13px; letter-spacing: .13em; text-transform: uppercase; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .card { display: flex; flex-direction: column; background: white; border: 1px solid #d9dfdc; color: inherit; text-decoration: none; transition: box-shadow .15s, transform .15s; }
    .card:hover { box-shadow: 0 12px 28px rgba(20,46,44,.1); transform: translateY(-2px); }
    .card .thumb { aspect-ratio: 2 / 1; background: #f4f0e8; display: grid; place-items: center; color: #7d8f8b; font-size: 12px; overflow: hidden; }
    .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card .text { padding: 12px 14px 14px; }
    .card h3 { margin: 0 0 4px; font: 18px/1.2 Georgia, "Times New Roman", serif; }
    .card p { margin: 0; color: #526663; font-size: 13px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .doors { margin: 0 0 8px; font-size: 14px; }
    .card .meta { margin-top: 8px; color: #367069; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }

    /* Topic page: same parts as the single-chart template */
    .topic { flex: 1 1 auto; min-height: 480px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .topic header, .topic footer, .controls { flex: 0 0 auto; min-width: 0; }
    .topic h1 { margin: 0 0 6px; font: 28px/1.1 Georgia, "Times New Roman", serif; letter-spacing: -.025em; }
    #note { margin: 0; color: #48605e; font-size: 13px; line-height: 1.45; max-width: 900px; }
    .controls { display: flex; align-items: center; gap: 10px; font-size: 13px; }
    #picks { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-width: 0; max-width: 100%; }
    select { min-width: 0; max-width: 100%; padding: 7px; border: 1px solid #c4d3cd; background: white; color: inherit; font: inherit; }
    .chart-area { flex: 1 1 auto; min-height: 260px; min-width: 0; position: relative; background: white; }
    #chart { position: absolute; inset: 0; width: 100%; height: 100%; }
    #preview { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: white; z-index: 1; }
    #status { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: #48605e; background: white; z-index: 2; }
    .topic footer { border-top: 1px solid #cbd6d1; padding-top: 8px; font-size: 11px; line-height: 1.5; overflow-wrap: anywhere; }
    #downloads { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 4px; }

    @media (max-width: 699px) {
      .bar { padding: 0 10px; justify-content: space-between; }
      .menus, .home-link { display: none; }
      .topics-button { display: flex; align-items: center; gap: 6px; padding: 12px 4px; border: 0; background: none; color: #164b45; font: 700 14px Arial, sans-serif; cursor: pointer; }
      .bar.open .menus { display: block; position: absolute; top: 100%; left: 0; right: 0; max-height: calc(100vh - 60px); overflow-y: auto; background: white; border-bottom: 1px solid #cbd6d1; box-shadow: 0 12px 28px rgba(20,46,44,.12); }
      .bar.open .menu { display: block; }
      .bar.open .menu > button { display: none; }
      .bar.open .list { display: block !important; position: static; border: 0; box-shadow: none; padding: 0 0 6px; }
      .topic { padding: 10px; gap: 8px; }
      .topic h1 { font-size: 23px; }
      #note { font-size: 12px; }
      .home h1 { font-size: 27px; }
    }
  </style>
</head>
<body>
  <nav class="bar" id="bar" aria-label="Topics">
    <a class="brand" href="#">Altitude</a>
    <a class="home-link" id="home-link" href="#">Overview</a>
    <div class="menus" id="menus"></div>
    <button class="topics-button" id="topics-button" aria-expanded="false" aria-controls="menus">Topics ☰</button>
  </nav>
  <main>
    <section class="home" id="home" hidden>
      <h1 id="heading">New Zealand and Ireland in charts</h1>
      <p><span id="intro">Economic, tourism and housing data from public sources, updated as new figures are released.</span> Pick a topic from the menus above or a card below.</p>
      <p class="doors" id="doors" hidden></p>
      <p class="doors"><a href="../route-map/">Aviation route map</a> · Open your route table and download a map.</p>
      <div id="groups"></div>
    </section>
    <section class="topic" id="topic" hidden>
      <header><h1 id="title"></h1><p id="note"></p></header>
      <div class="controls" id="controls" hidden>
        <span id="view-control"><label for="view">Chart view</label> <select id="view"></select></span>
        <span id="picks" hidden></span>
      </div>
      <section class="chart-area" aria-label="Interactive chart">
        <img id="preview" width="1200" height="600" alt="" hidden>
        <div id="chart"></div><div id="status" role="status" aria-live="polite">Loading chart…</div>
      </section>
      <footer>
        <span id="source"></span><span id="updated"></span>
        <nav id="downloads" aria-label="Chart downloads"></nav>
      </footer>
    </section>
  </main>
  <script>
    (() => {
      // Each front door (publish/nz/, publish/ireland/) is this page with data-site set.
      // Its menus come from site_menus in dev/publish_all.R, via index.json.
      const SITE = document.documentElement.dataset.site || "";
      const root = new URL(SITE ? "../" : "./", location.href);
      let MENUS = [];
      const $ = id => document.getElementById(id);
      const chart = $("chart"), preview = $("preview"), status = $("status"), viewSelect = $("view");
      let catalogue = [], manifest, folder, activeSpec, requestNumber = 0, fetchController, resizeFrame;
      let wasNarrow = innerWidth < 600;
      let plotlyReady, pickReady;

      function loadPlotly() {
        plotlyReady ??= new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = "https://cdn.plot.ly/plotly-cartesian-2.27.0.min.js";
          script.async = true;
          script.onload = resolve;
          script.onerror = () => reject(new Error("Chart library is unavailable"));
          document.head.append(script);
        });
        plotlyReady.catch(() => {});
        return plotlyReady;
      }

      // pick.js combines single-series views for charts whose manifest has a pick block.
      function loadPick() {
        pickReady ??= new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = assetUrl("pick.js");
          script.onload = resolve;
          script.onerror = () => reject(new Error("Chart helper is unavailable"));
          document.head.append(script);
        });
        return pickReady;
      }

      const slugOf = item => item.spec.replace(/\.json$/i, "").split("/").pop();

      function assetUrl(path, base = root) {
        if (typeof path !== "string" || !path) throw new Error("Missing chart asset");
        const url = new URL(path, base);
        if (url.origin !== root.origin || !url.pathname.startsWith(root.pathname)) throw new Error("Chart assets must be on this site");
        return url.href;
      }

      async function readJson(path, base, signal) {
        const response = await fetch(assetUrl(path, base), {signal});
        if (!response.ok) throw new Error("Chart file is unavailable");
        return response.json();
      }

      function formattedDate(value) {
        if (typeof value !== "string" || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return "not recorded";
        const date = new Date(value + "T12:00:00Z");
        if (!Number.isFinite(date.getTime())) return "not recorded";
        return new Intl.DateTimeFormat("en-NZ", {day: "numeric", month: "short", year: "numeric", timeZone: "UTC"}).format(date);
      }

      function grouped() {
        const known = new Set(catalogue.map(entry => entry.name));
        const byName = Object.fromEntries(catalogue.map(entry => [entry.name, entry]));
        const groups = MENUS.map(menu => ({label: menu.label, entries: menu.topics.filter(name => known.has(name)).map(name => byName[name])}));
        const listed = new Set(MENUS.flatMap(menu => menu.topics));
        groups.push({label: "More", entries: catalogue.filter(entry => !listed.has(entry.name))});
        return groups.filter(group => group.entries.length);
      }

      function closeMenus() {
        document.querySelectorAll(".menu .list").forEach(list => list.hidden = true);
        document.querySelectorAll(".menu > button").forEach(button => button.setAttribute("aria-expanded", "false"));
        $("bar").classList.remove("open");
        $("topics-button").setAttribute("aria-expanded", "false");
      }

      function buildMenus() {
        const menus = $("menus"), groupsEl = $("groups");
        for (const group of grouped()) {
          const menu = document.createElement("div");
          menu.className = "menu";
          menu.dataset.topics = group.entries.map(entry => entry.name).join(" ");
          const button = document.createElement("button");
          button.textContent = group.label;
          button.setAttribute("aria-expanded", "false");
          const list = document.createElement("ul");
          list.className = "list";
          list.hidden = true;
          const heading = document.createElement("li");
          heading.className = "group";
          heading.textContent = group.label;
          list.append(heading);
          for (const entry of group.entries) {
            const item = document.createElement("li");
            const link = document.createElement("a");
            link.href = "#" + entry.name;
            link.textContent = entry.title || entry.name;
            link.dataset.topic = entry.name;
            item.append(link);
            list.append(item);
          }
          button.addEventListener("click", event => {
            event.stopPropagation();
            const open = list.hidden;
            closeMenus();
            list.hidden = !open;
            button.setAttribute("aria-expanded", String(open));
          });
          menu.append(button, list);
          menus.append(menu);

          const title = document.createElement("h2");
          title.className = "group-title";
          title.textContent = group.label;
          const grid = document.createElement("div");
          grid.className = "grid";
          for (const entry of group.entries) {
            const card = document.createElement("a");
            card.className = "card";
            card.href = "#" + entry.name;
            // Thumbnail only when a PNG was published; otherwise a plain text card.
            const thumb = document.createElement("div");
            thumb.className = "thumb";
            if (entry.image) {
              const img = document.createElement("img");
              img.loading = "lazy";
              img.alt = "";
              img.src = assetUrl(entry.image);
              img.onerror = () => thumb.remove();
              thumb.append(img);
            }
            const text = document.createElement("div");
            text.className = "text";
            const h3 = document.createElement("h3");
            h3.textContent = entry.title || entry.name;
            const p = document.createElement("p");
            p.textContent = entry.note || "";
            const meta = document.createElement("div");
            meta.className = "meta";
            meta.textContent = "Updated " + formattedDate(entry.updated);
            text.append(h3, p, meta);
            if (entry.image) card.append(thumb);
            card.append(text);
            grid.append(card);
          }
          groupsEl.append(title, grid);
        }
        document.addEventListener("click", closeMenus);
        document.addEventListener("keydown", event => { if (event.key === "Escape") closeMenus(); });
        $("topics-button").addEventListener("click", event => {
          event.stopPropagation();
          const open = !$("bar").classList.contains("open");
          closeMenus();
          $("bar").classList.toggle("open", open);
          $("topics-button").setAttribute("aria-expanded", String(open));
        });
      }

      function markCurrent(name) {
        $("home-link").classList.toggle("current", !name);
        document.querySelectorAll(".menu").forEach(menu => menu.classList.toggle("current", !!name && menu.dataset.topics.split(" ").includes(name)));
        document.querySelectorAll(".list a").forEach(link => {
          if (link.dataset.topic === name) link.setAttribute("aria-current", "page"); else link.removeAttribute("aria-current");
        });
      }

      function frameLayout(spec) {
        const layout = structuredClone(spec.layout || {});
        delete layout.width;
        delete layout.height;
        layout.autosize = true;
        if (innerWidth < 600) {
          layout.legend = {...layout.legend, orientation: "h", x: 0, xanchor: "left", y: -0.25, yanchor: "top"};
          const hasEndLabels = spec.data.some(trace => trace.mode === "text" && trace.showlegend === false);
          layout.margin = {...layout.margin, l: 44, r: hasEndLabels ? Math.max(layout.margin?.r || 0, 12) : 12, b: Math.max(layout.margin?.b || 0, 90)};
          for (const key of Object.keys(layout).filter(key => /^xaxis\d*$/.test(key))) {
            const selector = layout[key]?.rangeselector;
            if (selector) layout[key].rangeselector = {...selector, x: 0, xanchor: "left", font: {...selector.font, size: 10}};
          }
        }
        return layout;
      }

      function showError() {
        status.textContent = "We couldn’t load this chart. Please try again later.";
        status.hidden = false;
        chart.setAttribute("aria-hidden", "true");
      }

      async function draw(spec) {
        await loadPlotly();
        if (!window.Plotly) throw new Error("Chart library is unavailable");
        if (!Array.isArray(spec.data)) throw new Error("Invalid chart");
        const config = {...spec.config, responsive: true};
        if (innerWidth < 600) config.displayModeBar = false;
        await Plotly.react(chart, spec.data, frameLayout(spec), config);
      }

      async function loadSpec(getSpec, number, isDefault) {
        fetchController?.abort();
        fetchController = new AbortController();
        status.textContent = "Loading chart…";
        status.hidden = !preview.hidden && isDefault;
        chart.setAttribute("aria-hidden", "true");
        try {
          const spec = await getSpec(fetchController.signal);
          if (number !== requestNumber) return;
          await draw(spec);
          if (number !== requestNumber) return;
          activeSpec = spec;
          preview.hidden = true;
          chart.removeAttribute("aria-hidden");
          status.hidden = true;
        } catch (error) {
          if (number === requestNumber && error.name !== "AbortError") showError();
        }
      }

      function loadView(index, number) {
        return loadSpec(signal => readJson(manifest.views[index].spec, folder, signal), number, index === 0);
      }

      const isPickDefault = chosen => String(chosen) === String(manifest.pick.default || [0]);

      function loadPicks(chosen, number) {
        return loadSpec(async signal => {
          const specs = await Promise.all(chosen.map(i => readJson(manifest.views[i].spec, folder, signal)));
          if (specs.length === 1) return specs[0];
          await loadPick();
          return AltitudePick.combine(specs, manifest.pick, chosen, manifest.views.map(item => item.label));
        }, number, isPickDefault(chosen));
      }

      // pick.js builds the boxes (see AltitudePick.setup).
      async function setupPicks(name, requested, number) {
        await loadPick();
        if (number !== requestNumber) return;
        const chosen = AltitudePick.setup($("picks"), manifest, requested, (picks, slugs) => {
          const query = isPickDefault(picks) ? "" : "?series=" + slugs.map(encodeURIComponent).join(",");
          history.replaceState(null, "", "#" + name + query);
          loadPicks(picks, ++requestNumber);
        });
        $("view-control").hidden = true;
        $("picks").hidden = false;
        $("controls").hidden = false;
        return loadPicks(chosen, number);
      }

      function addDownload(label, path) {
        if (!path) return;
        const link = document.createElement("a");
        link.href = assetUrl(path, folder);
        link.download = "";
        link.textContent = label;
        $("downloads").append(link);
      }

      async function showTopic(name, view, series) {
        const number = ++requestNumber;
        const entry = catalogue.find(item => item.name === name);
        if (!entry) return showHome();
        loadPlotly();
        $("home").hidden = true;
        $("topic").hidden = false;
        markCurrent(name);
        activeSpec = null;
        if (window.Plotly) Plotly.purge(chart);
        folder = new URL(name + "/", root);
        $("title").textContent = entry.title || name;
        $("note").textContent = entry.note || "";
        $("source").textContent = "";
        $("updated").textContent = "";
        $("downloads").replaceChildren();
        viewSelect.replaceChildren();
        $("controls").hidden = true;
        $("view-control").hidden = false;
        $("picks").hidden = true;
        preview.hidden = true;
        status.textContent = "Loading chart…";
        status.hidden = false;
        document.title = (entry.title || name) + " · Altitude charts";
        try {
          manifest = await readJson("manifest.json", folder);
          if (number !== requestNumber) return;
          if (!Array.isArray(manifest.views) || !manifest.views.length) throw new Error("No chart views");
          $("source").textContent = "Source: " + (manifest.source || "not recorded");
          $("updated").textContent = " · Data last updated: " + formattedDate(manifest.updated);
          addDownload("Download data", manifest.data);
          addDownload("Download image", manifest.image);
          if (manifest.image) {
            preview.src = assetUrl(manifest.image, folder);
            preview.alt = manifest.image_alt || manifest.title || "Chart preview";
            preview.hidden = false;
            status.hidden = true;
            preview.onerror = () => { preview.hidden = true; if (!activeSpec) status.hidden = false; };
          }
          if (manifest.pick) return await setupPicks(name, series, number);
          manifest.views.forEach((item, index) => {
            const option = document.createElement("option");
            option.value = String(index);
            option.textContent = item.label;
            viewSelect.append(option);
          });
          $("controls").hidden = manifest.views.length < 2;
          const selected = manifest.views.findIndex(item => slugOf(item) === view);
          viewSelect.value = String(selected < 0 ? 0 : selected);
          await loadView(Number(viewSelect.value), number);
        } catch (error) {
          if (number === requestNumber) showError();
        }
      }

      function showHome() {
        ++requestNumber;
        $("topic").hidden = true;
        $("home").hidden = false;
        markCurrent(null);
        document.title = "Altitude charts";
      }

      function route() {
        closeMenus();
        const [name, query] = decodeURIComponent(location.hash.slice(1)).split("?");
        const params = new URLSearchParams(query || "");
        if (name) showTopic(name, params.get("view"), (params.get("series") || "").split(",").filter(Boolean)); else showHome();
      }

      viewSelect.addEventListener("change", () => {
        const index = Number(viewSelect.value);
        const slug = slugOf(manifest.views[index]);
        const name = location.hash.slice(1).split("?")[0];
        history.replaceState(null, "", "#" + name + (index ? "?view=" + encodeURIComponent(slug) : ""));
        loadView(index, ++requestNumber);
      });

      addEventListener("resize", () => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(async () => {
          if (!activeSpec || !status.hidden || $("topic").hidden) return;
          try {
            const narrow = innerWidth < 600;
            if (narrow !== wasNarrow) { wasNarrow = narrow; await draw(activeSpec); }
            await Plotly.Plots.resize(chart);
          } catch (error) { showError(); }
        });
      });

      addEventListener("hashchange", route);
      readJson("index.json")
        .then(index => {
          const sites = Array.isArray(index.sites) ? index.sites : [];
          const site = sites.find(item => item.key === SITE);
          catalogue = Array.isArray(index.charts) ? index.charts : [];
          if (site) {
            catalogue = catalogue.filter(entry => entry.site === SITE);
            MENUS = site.menus;
            $("heading").textContent = site.heading;
            $("intro").textContent = site.intro;
            document.querySelector(".brand").textContent = "Altitude · " + site.label;
          } else MENUS = sites.flatMap(item => item.menus.map(menu => ({...menu, label: sites.length > 1 ? item.label + ": " + menu.label : menu.label})));
          const others = sites.filter(item => item.key !== SITE);
          if (SITE && others.length) {
            $("doors").append("Also see: ");
            others.forEach((item, i) => {
              const link = document.createElement("a");
              link.href = assetUrl(item.key + "/");
              link.textContent = item.heading;
              $("doors").append(...(i ? [", ", link] : [link]));
            });
            $("doors").hidden = false;
          }
          buildMenus();
          route();
        })
        .catch(() => { showHome(); $("groups").textContent = "We couldn’t load the list of charts. Please try again later."; });
    })();
  </script>
</body>
</html>
