<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">CSV logo colour options</title>
  <desc id="desc">The light-background logo and dark-background logo shown side by side.</desc>
  <rect width="560" height="500" fill="#FAFAF8"/>
  <rect x="560" width="560" height="500" fill="#1E1F21"/>
  <text x="48" y="58" fill="#64676C" font-family="Arial, sans-serif" font-size="18">LIGHT BACKGROUND</text>
  <text x="608" y="58" fill="#8FD3CF" font-family="Arial, sans-serif" font-size="18">DARK BACKGROUND</text>
  <g transform="translate(120 108)">
    <g fill="none" stroke-linecap="butt">
      <path d="M 274 7 A 136 136 0 1 1 22 188" stroke="#222326" stroke-width="42"/>
      <path d="M 22 188 A 136 136 0 0 1 48 153" stroke="#0E6B6B" stroke-width="42"/>
    </g>
    <text x="-4" y="124" fill="#222326" font-family="Arial Black, Arial, sans-serif" font-size="91" font-weight="900" letter-spacing="-5">.CSV</text>
  </g>
  <g transform="translate(680 108)">
    <g fill="none" stroke-linecap="butt">
      <path d="M 274 7 A 136 136 0 1 1 22 188" stroke="#F6F0E6" stroke-width="42"/>
      <path d="M 22 188 A 136 136 0 0 1 48 153" stroke="#8FD3CF" stroke-width="42"/>
    </g>
    <text x="-4" y="124" fill="#F6F0E6" font-family="Arial Black, Arial, sans-serif" font-size="91" font-weight="900" letter-spacing="-5">.CSV</text>
  </g>
</svg>
