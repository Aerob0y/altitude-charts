<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Illustrative diagram: return on capital, depreciation, operating costs and tax add up to the revenue requirement, which divided by forecast passengers gives the price per passenger" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1200" height="700" fill="#FFFFFF"/>
<g font-family="'Libre Franklin', Inter, 'Helvetica Neue', Arial, sans-serif">
<text x="80" y="50" font-size="30" font-weight="700" fill="#13201F">How a regulated airport price is built</text>
<text x="80" y="84" font-size="19" fill="#55646A">Building blocks of the revenue requirement. Illustrative, not to scale.</text>
<rect x="80" y="440" width="130" height="160" fill="#9CC9C3"/>
<rect x="250" y="350" width="130" height="90" fill="#9CC9C3"/>
<rect x="420" y="220" width="130" height="130" fill="#9CC9C3"/>
<rect x="590" y="180" width="130" height="40" fill="#9CC9C3"/>
<rect x="760" y="180" width="130" height="420" fill="#0F5F5A"/>
<g stroke="#55646A" stroke-width="1.5" stroke-dasharray="5 5">
<line x1="210" y1="440" x2="250" y2="440"/><line x1="380" y1="350" x2="420" y2="350"/><line x1="550" y1="220" x2="590" y2="220"/><line x1="720" y1="180" x2="760" y2="180"/>
</g>
<line x1="60" y1="600" x2="900" y2="600" stroke="#13201F" stroke-width="2"/>
<g font-size="18" fill="#3A484D" text-anchor="middle">
<text x="145" y="632">Return on</text><text x="145" y="654">capital (WACC)</text>
<text x="315" y="632">Depreciation</text>
<text x="485" y="632">Operating</text><text x="485" y="654">costs</text>
<text x="655" y="632">Tax</text>
<text x="825" y="632" font-weight="700" fill="#13201F">Revenue</text><text x="825" y="654" font-weight="700" fill="#13201F">requirement</text>
</g>
<line x1="900" y1="390" x2="946" y2="390" stroke="#13201F" stroke-width="3"/>
<polygon points="946,380 962,390 946,400" fill="#13201F"/>
<text x="1056" y="352" font-size="17" fill="#55646A" text-anchor="middle">÷ forecast passengers</text>
<rect x="966" y="366" width="180" height="96" rx="8" fill="#13201F"/>
<text x="1056" y="408" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">Price per</text>
<text x="1056" y="434" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">passenger</text>
</g>
</svg>
