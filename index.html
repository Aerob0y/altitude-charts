  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: #fbfaf7; color: #142e2c; font-family: Arial, sans-serif; }
    main { width: 100%; max-width: 640px; }
    h1 { margin: 0 0 8px; font: 34px/1.1 Georgia, serif; letter-spacing: -.03em; }
    p { margin: 0 0 24px; color: #48605e; line-height: 1.6; }
    .doors { display: grid; gap: 16px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .doors a { display: flex; align-items: center; gap: 14px; min-width: 0; padding: 20px; background: white; border: 1px solid #d9dfdc; color: inherit; text-decoration: none; font: 22px/1.2 Georgia, serif; }
    .doors a:hover { box-shadow: 0 12px 28px rgba(20,46,44,.1); }
    .doors svg { flex: 0 0 48px; width: 48px; height: 48px; color: #367069; }
    :focus-visible { outline: 2px solid #164b45; outline-offset: 3px; }
    @media (max-width: 480px) {
      h1 { font-size: 29px; }
      .doors { gap: 12px; }
      .doors a { gap: 8px; padding: 16px 10px; font-size: 18px; min-height: 92px; }
      .doors svg { flex-basis: 34px; width: 34px; height: 34px; }
    }
  </style>
